[package]
name = "simple-slideshow-maker"
description = "A simple, modern slideshow creator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "simple-slideshow-maker"
path = "src/main.rs"

[features]
default = ["audio-preview"]
audio-preview = ["dep:rodio"]

[dependencies]
slideshow-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "symphonia-all"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.simpleslideshow.maker"
apk_name = "SimpleSlideshowMaker"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
